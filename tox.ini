[tox]
env_list =
    py311-drf316dj52
    py312-drf316dj52
    py313-drf316dj52
    py314-drf316dj52
    py311-drf317dj{52, 60}
    py312-drf317dj{52, 60}
    py313-drf317dj{52, 60}
    py314-drf317dj{52, 60}
    py311-drf318dj{52, 60, 61}
    py312-drf318dj{52, 60, 61}
    py313-drf318dj{52, 60, 61}
    py314-drf318dj{52, 60, 61}
    py315-drf318dj{61}



[testenv]
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg
set_env =
    PYTHONDEVMODE = 1
commands =
    python \
      -W error::ResourceWarning \
      -W error::DeprecationWarning \
      -W error::PendingDeprecationWarning \
      -m coverage run \
      -m pytest {posargs:tests}
dependency_groups =
    test
    drf316dj52: drf316dj52
    drf317dj52: drf317dj52
    drf317dj60: drf317dj60
    drf318dj52: drf318dj52
    drf318dj60: drf318dj60
    drf318dj61: drf318dj61
