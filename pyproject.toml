[project]
name = "djangorestframework-camel-case"
version = "1.4.2"
description = "Camel case JSON support for Django REST framework."
readme = "README.rst"
maintainers = [
    { name = "Justin Michalicek", email = "jmichalicek@gmail.com" }
]
authors = [
  { name = "Vitaly Babiy", email = "vbabiy86@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
  "djangorestframework>=3.16.1",
  "django>=5.2"
]
license = "BSD-3-Clause"

[project.scripts]
djangorestframework-camel-case = "djangorestframework_camel_case:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/jmichalicek/djangorestframework-camel-case"

[dependency-groups]
test = [
  "pytest",
  "pytest-django",
  "djangorestframework>=3.16.1",
  "coverage[toml]",
]
dev = [
  "ruff",
  "pre-commit",
  "mypy",
  "django-stubs",
  "djangorestframework-stubs",
  "pyupgrade",
  "django-upgrade",
  { include-group = "test" } 
]
django52 = [ "django>=5.2a1,<6" ]
django60 = [ "django>=6a1,<6.1; python_version>='3.12'" ]
django61 = [ "django>=6.1a1,<6.2; python_version>='3.12'" ]

[tool.uv]
conflicts = [
  [
    { group = "django52" },
    { group = "django60" },
    { group = "django61" },
  ],
]

[tool.mypy]
mypy_path = "src/"
plugins = ["mypy_django_plugin.main"]
exclude = 'migrations'
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py37"
exclude = ["migrations", ".uv_cache", ".ruff_cache", ".venv"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "django", "wagtail", "third-party", "first-party", "local-folder"]
known-first-party = ["djangorestframework_camel_case"]

[tool.pytest]
django_find_project = false